name: Import private development source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-private.yml']
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'maganrobotics-boop/OmindOS-Manipulation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import public base and apply private development changes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://github.com/maganrobotics-boop/OmindOS-Manipulation-Community/archive/22686a8.tar.gz -o /tmp/base.tar.gz
          mkdir /tmp/base
          tar -xzf /tmp/base.tar.gz -C /tmp/base --strip-components=1
          cp .bootstrap/development.patch /tmp/development.patch
          cp -a /tmp/base/. .
          git apply --check /tmp/development.patch
          git apply /tmp/development.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github
          git commit -m 'Import complete OmindOS Manipulation 0.2 development source'
          git push origin HEAD:main
