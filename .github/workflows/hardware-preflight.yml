name: UR3e read-only preflight
on:
  push:
    branches: [main, hardware-ur3e-preflight, hardware-tcp-discovery]
    paths:
      - 'community/hardware/**'
      - 'configs/hardware/**'
      - '.github/workflows/hardware-preflight.yml'
  pull_request:
    paths:
      - 'community/hardware/**'
      - 'configs/hardware/**'
      - '.github/workflows/hardware-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 10
    env:
      ROS_LOCALHOST_ONLY: '1'
      ROS_DOMAIN_ID: '83'
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y ros-humble-control-msgs ros-humble-controller-manager-msgs ros-humble-sensor-msgs
      - shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 -m unittest -v community.hardware.test_preflight community.hardware.test_dashboard_probe community.hardware.test_preflight_ros2
